name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: 11
    - name: Compile
      run: ./mill __.compile
    - name: Test
      run: ./mill upload.test

  # Builds native images with the GraalVM versions corresponding to Java LTS versions
  # (see NativeImageTests.graalVmJvmIds)
  test-plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        mill: ["1", "2"]
    name: test-plugin (${{ matrix.os }}, Mill ${{ matrix.mill }})
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: 11
    - name: Test
      if: runner.os != 'Windows'
      run: ./mill 'plugin[${{ matrix.mill }}].test'
    # native-image needs MSVC on Windows, which the plugin finds via vcvarsall
    # (Visual Studio is installed on GitHub's Windows runners)
    - name: Test (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: .\mill.bat "plugin[${{ matrix.mill }}].test"
      env:
        # Keep the paths of the GraalVM files short: with the default archive cache location,
        # some GraalVM header paths go beyond 260 characters, and MSVC fails to include them
        COURSIER_ARCHIVE_CACHE: C:\cs-arc
        # Prevents vcvarsall from leaving a telemetry process running in the test directories,
        # which prevents their deletion
        VSCMD_SKIP_SENDTELEMETRY: "1"

  test-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: 11
      - name: Publish plugin locally
        run: ./mill -i 'plugin[1].publishLocal'
      - name: Use the locally published plugin in the example
        run: .github/scripts/use-local-plugin-in-example.sh
      - name: Compile example
        working-directory: example
        run: ./mill __.compile
      - name: Check the example uses the locally published plugin
        run: .github/scripts/check-example-uses-local-plugin.sh
      - name: Run example tests
        working-directory: example
        run: ./mill __.test
      - name: Generate example native image
        working-directory: example
        run: ./mill show hello.nativeImage

  format:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: VirtusLab/scala-cli-setup@v1
      - run: scala-cli fmt . --check

  publish:
    if: github.event_name == 'push' && github.repository == 'alexarchambault/mill-native-image'
    runs-on: ubuntu-latest
    # never publish to Sonatype Central from two jobs at the same time
    concurrency:
      group: sonatype-central-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: 21
    - name: Release
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "mill-native-image-${GITHUB_REF#refs/tags/v}" --shouldRelease false
        else
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/
        fi
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: |
        ./mill -i mill.javalib.MavenPublishModule/publishAll \
          --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
          --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
      env:
        MILL_MAVEN_USERNAME: ${{ github.actor }}
        MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
